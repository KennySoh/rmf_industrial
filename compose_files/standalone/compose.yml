version: '3'
services:
  mosquitto:
    image: eclipse-mosquitto
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - mosquitto-net
    volumes:
      - ./mosquitto:/etc/mosquitto
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
      - "1884:1884"
      - "1885:1885"
      - "1886:1886"
      - "1887:1887"
      - "1888:1888"

    expose:
      - 1883
      - 1884
      - 1885
      - 1886
      - 1887
      - 1888
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2181"
    networks:
      - fiware-net
  kafka:
    image: bitnami/kafka:3.5.1-debian-11-r6
    container_name: kafka
    ports:
      - "9092"
    networks:
      - fiware-net
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_LOG_RETENTION_MS: 10000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - zookeeper
  postgres:
    image: postgis/postgis
    container_name: postgres
    ports:
      - "5432"
    networks:
      - fiware-net
      - mosquitto-net
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  scorpio:
    image: scorpiobroker/all-in-one-runner:ubuntu-kafka-latest
    hostname: scorpio
    container_name: scorpio
    ports:
      - "${CONTEXT_BROKER_PORT}:${CONTEXT_BROKER_PORT}"
    networks:
      - fiware-net
      - mosquitto-net
    environment:
      DBHOST: postgres
      BUSHOST: kafka
    depends_on:
      - postgres
      - kafka
  valkey:
    image: valkey/valkey:8.0
    hostname: valkey
    container_name: valkey
    restart: unless-stopped
    expose:
      - ${VALKEY_PORT}
      - "8001"
    networks:
      - valkey-net
networks:
  fiware-net:
    name: fiware-net
    driver: bridge
  valkey-net:
    name: valkey-net
    driver: bridge
  mosquitto-net:
    name: mosquitto-net
    driver: bridge