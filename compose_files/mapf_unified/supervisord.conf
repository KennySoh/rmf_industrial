[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

;==============================================================================
; FIWARE Map Server - Must start first to receive map uploads
; Provides map data to other services via Scorpio Context Broker
;==============================================================================
[program:fiware_map_server]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /colcon_ws/install/setup.bash && ros2 run fiware_map fiware_map_server http://%(ENV_CONTEXT_BROKER_HOST)s:%(ENV_CONTEXT_BROKER_PORT)s %(ENV_ALL_IPS)s %(ENV_MAP_SERVER_PORT)s"
directory=/colcon_ws
autostart=true
autorestart=true
priority=50
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/fiware_map_server.log
stderr_logfile=/var/log/supervisor/fiware_map_server_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; Load Maps - One-shot task to upload maps to Context Broker via map server
; Runs after fiware_map_server starts, then exits
;==============================================================================
[program:load_maps]
command=/bin/bash -c "sleep 5 && source /opt/ros/humble/setup.bash && source /colcon_ws/install/setup.bash && ros2 run fiware_map load_maps http://localhost:%(ENV_MAP_SERVER_PORT)s rmf1"
directory=/colcon_ws
autostart=true
autorestart=false
priority=75
startsecs=0
startretries=3
stdout_logfile=/var/log/supervisor/load_maps.log
stderr_logfile=/var/log/supervisor/load_maps_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; MAPF Solver - Must start early (lowest priority number = starts first)
; NOTE: First arg is the bind address (use 0.0.0.0 to bind to all interfaces)
;==============================================================================
[program:mapf_solver]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /colcon_ws/install/setup.bash && ros2 run mapf run_mapf_service 0.0.0.0 %(ENV_MAPF_SOLVER_SERVER_PORT)s"
directory=/colcon_ws
autostart=true
autorestart=true
priority=100
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/mapf_solver.log
stderr_logfile=/var/log/supervisor/mapf_solver_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; ADG Executor - Starts after mapf_solver
; Waits for map to be available in Context Broker AND RabbitMQ to be reachable
;==============================================================================
[program:adg_executor]
command=/bin/bash -c "echo 'Waiting for RabbitMQ at %(ENV_AMQP_HOST)s:%(ENV_AMQP_PORT)s...' && until python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('%(ENV_AMQP_HOST)s', %(ENV_AMQP_PORT)s)); s.close(); print('RabbitMQ reachable!')\" 2>/dev/null; do echo 'RabbitMQ not ready, waiting...'; sleep 2; done && echo 'Waiting for map %(ENV_BUILDING_NAME)s in Context Broker...' && until curl -s http://%(ENV_CONTEXT_BROKER_HOST)s:%(ENV_CONTEXT_BROKER_PORT)s/ngsi-ld/v1/entities/urn:ngsi-ld:Map:%(ENV_BUILDING_NAME)s | grep -q 'Map'; do echo 'Map not ready, waiting...'; sleep 2; done && echo 'Map ready!' && source /opt/ros/humble/setup.bash && source /colcon_ws/install/setup.bash && cd /colcon_ws/src/mapf_execution && python3 -u -m adg_executor.main --mqtt_host %(ENV_MQTT_SERVER_HOST)s --mqtt_port %(ENV_ADG_MQTT_PORT)s --redis_host %(ENV_REDIS_HOST)s --redis_port %(ENV_REDIS_PORT)s --solver_url http://localhost:%(ENV_MAPF_SOLVER_SERVER_PORT)s --context_broker_url http://%(ENV_CONTEXT_BROKER_HOST)s:%(ENV_CONTEXT_BROKER_PORT)s --map_name %(ENV_BUILDING_NAME)s --agent %(ENV_AGENT_NAME)s"
directory=/colcon_ws
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=200
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/adg_executor.log
stderr_logfile=/var/log/supervisor/adg_executor_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; MAPF MRS (Movement Request Server FIWARE) - Starts after adg_executor
;==============================================================================
[program:mapf_mrs]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /colcon_ws/install/setup.bash && ros2 run mapf_fiware movement_request_server_fiware http://%(ENV_CONTEXT_BROKER_HOST)s:%(ENV_CONTEXT_BROKER_PORT)s %(ENV_MQTT_SERVER_HOST)s %(ENV_MRS_MQTT_SERVER_PORT)s http://localhost:%(ENV_MOVEMENT_REQUEST_SERVER_PORT)s %(ENV_REDIS_HOST)s %(ENV_REDIS_PORT)s true %(ENV_AMQP_HOST)s %(ENV_AMQP_PORT)s"
directory=/colcon_ws
autostart=true
autorestart=true
priority=300
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/mapf_mrs.log
stderr_logfile=/var/log/supervisor/mapf_mrs_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; Movement Request Server (FastAPI) - Can start independently
;==============================================================================
[program:movement_request_server]
command=/bin/bash -c "cd /app/movement_request_server/app && python3 -m uvicorn main:app --port %(ENV_MOVEMENT_REQUEST_SERVER_PORT)s --host 0.0.0.0"
directory=/app/movement_request_server
autostart=true
autorestart=true
priority=150
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/movement_request_server.log
stderr_logfile=/var/log/supervisor/movement_request_server_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

;==============================================================================
; Group all programs
;==============================================================================
[group:mapf_services]
programs=fiware_map_server,load_maps,mapf_solver,adg_executor,mapf_mrs,movement_request_server
priority=999
