version: '3'
services:
  vda5050_fiware:
    container_name: vda5050_fiware
    image: ${VDA5050_FIWARE_IMAGE}
    # build: /home/rosi/workspaces/test_ws/src/fiware/vda5050_fiware/.
    env_file:
      - .env
    ports:
      - "${VDA_FIWARE_MQTT_CLIENT_PORT}:${VDA_FIWARE_MQTT_CLIENT_PORT}"
    expose:
      - "${VDA_FIWARE_MQTT_CLIENT_PORT}"
    command: >
      bash -c " source /colcon_ws/install/setup.bash 
      && ros2 run vda5050_fiware vda5050_fiware ${MQTT_SERVER_HOST} ${VDA_FIWARE_MQTT_CLIENT_PORT} http://${CONTEXT_BROKER_HOST}:${CONTEXT_BROKER_PORT} ${BUILDING_NAME}"
    networks:
      - rmf2_broker_rmf-network
networks:
  rmf2_broker_rmf-network:
    external: true
